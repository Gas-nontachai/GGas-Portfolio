<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/g-neobrutal-favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ThangGas World Journey</title>
  </head>
  <body>
    <div id="root">
      <div
        class="loading-screen"
        data-phase="bootstrap"
        role="status"
        aria-labelledby="startup-title"
        style="
          position: fixed;
          inset: 0;
          display: grid;
          place-items: center;
          padding: 24px;
          box-sizing: border-box;
          background: #f3f3ee;
          color: #171717;
          font-family: monospace;
          text-align: center;
        "
      >
        <div class="loading-panel" style="width: 100%; max-width: 480px">
          <div
            class="loading-mark"
            aria-hidden="true"
            style="
              display: grid;
              place-items: center;
              width: 64px;
              height: 64px;
              margin: 0 auto 24px;
              border: 3px solid #171717;
              border-radius: 6px;
              background: #ffe16b;
              box-shadow: 4px 4px 0 #171717;
              box-sizing: border-box;
            "
          >
            <svg
              viewBox="0 0 32 32"
              width="32"
              height="32"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linejoin="round"
            >
              <path d="m16 3 3.5 9.5L29 16l-9.5 3.5L16 29l-3.5-9.5L3 16l9.5-3.5Z" />
            </svg>
          </div>
          <h1 id="startup-title" style="margin: 0; font-size: 24px; line-height: 1.35">
            THANGGAS WORLD JOURNEY
          </h1>
          <p
            class="loading-status"
            style="min-height: 30px; margin: 16px 0; font-size: 18px; line-height: 1.6"
          >
            Getting ready for the journey...
          </p>
          <div
            class="loading-track"
            data-indeterminate="true"
            style="
              height: 24px;
              padding: 3px;
              overflow: hidden;
              border: 2px solid #171717;
              box-sizing: border-box;
              background: white;
            "
            aria-hidden="true"
          >
            <span style="display: block; width: 28%; height: 100%; background: #ffe16b"></span>
          </div>
          <p
            class="loading-count"
            style="min-height: 24px; margin: 12px 0 0; font-size: 13px; line-height: 1.6"
          >
            Preparing the type and cursor
          </p>
          <div class="loading-detail" style="min-height: 56px; margin-top: 24px">
            <noscript>Please enable JavaScript to view this portfolio.</noscript>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
